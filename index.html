<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced Todo App</title>
    <style>
        body {
            background-color:white;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .container {
            background-color: #d66b6b;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 5px;
            background-color: #b12572;
            color: rgb(230, 225, 225);
            font-family: monospace;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: monospace;
        }

        .primary-btn {
            background-color: #4CAF50;
            color: white;
        }

        .danger-btn {
            background-color: #f44336;
            color: white;
        }

        .secondary-btn {
            background-color: #2196F3;
            color: white;
        }

        button:hover {
            opacity: 0.8;
        }

        .todo-list {
            margin-top: 20px;
        }

        .todo-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #b12572;
            font-family: monospace;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 5px;
            animation: slideIn 0.3s ease;
        }

        .todo-content {
            flex: 1;
            margin-right: 15px;
        }

        .todo-actions {
            display: flex;
            gap: 10px;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-10px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .edit-input {
            flex: 1;
            padding: 8px;
            background-color: #b12572;
            border: none;
            color: white;
            border-radius: 4px;
            font-family: monospace;
            border: 2px solid #4CAF50;
        }
    </style>
</head>
<body>
    <div id="header" style="text-align: center; margin-bottom: 20px; color: blueviolet; font-family:monospace; font-size: large;">
        <h1>Enhanced Todo App</h1>
        
        
    </div>
    <div class="container">
        <div class="input-group">
            <input type="text" placeholder="Enter a new task...">
            <button class="primary-btn" onclick="addTodo()">Add Task</button>
        </div>
        
        <div class="controls">
            <button class="danger-btn" onclick="deleteFirstTodo()">Delete First</button>
            <button class="danger-btn" onclick="deleteLastTodo()">Delete Last</button>
        </div>

        <div id="todos" class="todo-list"></div>
    </div>
    <div>
       <footer>
            <p style="text-align: center; color: blueviolet; font-family:monospace; font-size: large;">&copy; 2025 Enhanced Todo App</p>
            
       </footer>

    </div>

    <script>
        let todos = [];

        function addTodo() {
            const input = document.querySelector("input");
            if (input.value.trim()) {
                todos.push({
                    title: input.value.trim(),
                    editing: false
                });
                input.value = "";
                render();
            }
        }
        //function to add date and time to the todo

        function setTime(){
            const date = new Date();
            const options = { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' };
            return date.toLocaleString(undefined, options);
        }

        function deleteTodoAt(index) {
            todos.splice(index, 1);
            render();
        }

        function deleteFirstTodo() {
            todos.shift();
            render();
        }

        function deleteLastTodo() {
            todos.pop();
            render();
        }

        function toggleEdit(index) {
            todos[index].editing = !todos[index].editing;
            render();
        }

        function updateTodo(index, newTitle) {
            todos[index].title = newTitle;
            todos[index].editing = false;
            render();
        }

        function createTodoComponent(todo, index) {
            const div = document.createElement("div");
            div.className = "todo-item";

            const contentDiv = document.createElement("div");
            contentDiv.className = "todo-content";

            if (todo.editing) {
                const input = document.createElement("input");
                input.className = "edit-input";
                input.value = todo.title;
                input.onkeypress = (e) => {
                    if (e.key === 'Enter') updateTodo(index, input.value);
                };

                const saveButton = document.createElement("button");
                saveButton.className = "secondary-btn";
                saveButton.textContent = "Save";
                saveButton.onclick = () => updateTodo(index, input.value);

                contentDiv.append(input);
                div.append(contentDiv, saveButton);
            } else {
                const title = document.createElement("span");
                title.textContent = todo.title;

                const editButton = document.createElement("button");
                editButton.className = "secondary-btn";
                editButton.textContent = "Edit";
                editButton.onclick = () => toggleEdit(index);

                const deleteButton = document.createElement("button");
                deleteButton.className = "danger-btn";
                deleteButton.textContent = "Delete";
                deleteButton.onclick = () => deleteTodoAt(index);

                const actionsDiv = document.createElement("div");
                actionsDiv.className = "todo-actions";
                actionsDiv.append(editButton, deleteButton);

                const date = new Date();
                const dateTime = document.createElement("span");
                dateTime.textContent = setTime();
                dateTime.style.fontSize = "0.8em";
                dateTime.style.color = "#ccc";
                dateTime.style.marginLeft = "10px";
                title.appendChild(dateTime);
                


                contentDiv.append(title);
                div.append(contentDiv, actionsDiv);
            }

            return div;
        }

        function render() {
            const container = document.querySelector("#todos");
            container.innerHTML = "";
            
            todos.forEach((todo, index) => {
                const element = createTodoComponent(todo, index);
                container.appendChild(element);
            });
        }

        // Handle Enter key for adding todos
        document.querySelector("input").addEventListener("keypress", (e) => {
            if (e.key === 'Enter') addTodo();
        });
    </script>
</body>
</html>
